# Employee fork — Windows x64 Release build for QA testing.
#
# Triggered manually via "Run workflow" or automatically on a release-v* tag.
# Produces an artifact zip containing Release-mode Telegram.exe + Updater.exe
# that can run against the production Telegram API (logs into real accounts).
# Does NOT produce the packed update (tx64updNNNNNNN) — Pack & sign locally
# with the private RSA key after downloading and verifying the artifact.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   TG_API_ID    — numeric api_id
#   TG_API_HASH  — hex api_hash
# Use the same values you currently pass to configure.bat locally, otherwise
# Telegram may treat the build as a different client and force re-login.

name: Windows Release Build (employee)

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

jobs:
  windows-release:
    name: Windows x64 Release
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "employee-release" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-employee-release-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-employee-release-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-employee-release-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-employee-release-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-employee-release-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-employee-release-qt6-

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Configure & build (Release).
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if "%TG_API_ID%"=="" (
            echo ERROR: secrets.TG_API_ID is not set in this repo.
            exit /b 1
          )
          if "%TG_API_HASH%"=="" (
            echo ERROR: secrets.TG_API_HASH is not set in this repo.
            exit /b 1
          )

          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=%TG_API_ID% ^
          -D TDESKTOP_API_HASH=%TG_API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          if errorlevel 1 exit /b 1

          cmake --build ..\out --config Release --parallel
          if errorlevel 1 exit /b 1

      - name: Stage artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          copy %OUT%\Telegram.exe artifact\
          copy %OUT%\Updater.exe artifact\

      - name: Read app version.
        shell: bash
        run: |
          VER=$(grep '^AppVersionStr ' "$TBUILD/$REPO_NAME/Telegram/build/version" | awk '{print $2}')
          echo "APP_VERSION=$VER" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: tdesktopPro-${{ env.APP_VERSION }}-x64-release
          path: artifact\
          retention-days: 14
